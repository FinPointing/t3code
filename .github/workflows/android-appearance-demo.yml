name: Android Appearance Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-appearance-demo
  cancel-in-progress: false

jobs:
  apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: preview
      T3CODE_ANDROID_DEMO: "1"
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --filter @t3tools/mobile... --filter @t3tools/monorepo --child-concurrency 1
      - name: Check mobile types
        run: pnpm exec vp run --filter @t3tools/mobile typecheck
      - name: Test font preferences and terminal integration
        working-directory: apps/mobile
        run: pnpm exec vp test run src/lib/appearanceFonts.test.ts src/lib/googleFonts.test.ts src/lib/googleFontDownloads.test.ts src/lib/appearancePreferences.test.ts src/lib/storage.test.ts src/state/preferences.test.ts src/features/terminal/NativeTerminalSurface.test.tsx app.config.test.ts --maxWorkers=1
      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install
      - name: Build standalone ARM64 APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - uses: actions/upload-artifact@v4
        with:
          name: t3-appearance-demo-arm64
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEMO_COMMIT: ${{ github.sha }}
        run: |
          apk_path=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -tq "$apk_path"
          cp "$apk_path" "$RUNNER_TEMP/t3-appearance-demo-arm64.apk"
          cat > "$RUNNER_TEMP/t3-demo-notes.md" <<'NOTES'
          Android appearance preview with Inter as the default interface font and searchable Google Fonts for interface, prompt, code, and terminal text. Code and terminal choices are limited to monospace families. Selected fonts are cached for offline use.

          On your Android phone, download `t3-appearance-demo-arm64.apk` below, open it, and allow your browser to install apps if Android asks. Open **T3 Appearance Demo**, then **Settings → Appearance** to try the font choices. It installs alongside the official app; no Expo Go or development server is needed.

          This is a preview build signed with the demo key. Connect to your T3 Code server to use chat and terminal features.
          NOTES
          gh release create "android-fonts-preview-${DEMO_COMMIT:0:8}" \
            --target "$DEMO_COMMIT" \
            --title "Android font preview (${DEMO_COMMIT:0:8})" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/t3-demo-notes.md" \
            "$RUNNER_TEMP/t3-appearance-demo-arm64.apk"
